<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHJY托盘箱子摆放规划器</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #eef2f5;
      --ink: #1d2633;
      --muted: #66727f;
      --line: #263241;
      --soft-line: #c8d1dc;
      --panel: #ffffff;
      --panel-2: #f7fafc;
      --field: #ffffff;
      --control: #ffffff;
      --control-hover: #fff8e7;
      --canvas-a: #eef5fb;
      --canvas-b: #f8fbfd;
      --scene-a: #ffffff;
      --scene-b: #ffffff;
      --accent: #f59f0b;
      --accent-2: #2f8cff;
      --good: #28a66a;
      --bad: #d64b42;
      --pallet: #d8ad6a;
      --box: #4f8df6;
      --shadow: 0 14px 34px rgba(24, 35, 48, .12);
      --radius: 8px;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    :root[data-theme="dark"] {
      --bg: #101722;
      --ink: #edf4ff;
      --muted: #aab7c7;
      --line: #7f93aa;
      --soft-line: #334255;
      --panel: #172232;
      --panel-2: #121b28;
      --field: #0f1722;
      --control: #182638;
      --control-hover: #24344a;
      --canvas-a: #111a26;
      --canvas-b: #172535;
      --scene-a: #ffffff;
      --scene-b: #ffffff;
      --shadow: 0 14px 34px rgba(0, 0, 0, .36);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(38,50,65,.04) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(0deg, rgba(38,50,65,.04) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--bg);
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 2px solid var(--line);
      background: var(--control);
      color: var(--ink);
      min-height: 34px;
      border-radius: 7px;
      padding: 7px 10px;
      box-shadow: 0 3px 0 rgba(29,38,51,.18);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      white-space: nowrap;
    }

    button:hover { background: var(--control-hover); }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(29,38,51,.2); }
    button.primary { background: var(--accent); color: #21160b; }
    button.blue { background: #dbeaff; }
    button.green { background: #ddf7e9; }
    button.danger { background: #ffe3de; }
    :root[data-theme="dark"] button.blue { background: #193655; color: var(--ink); }
    :root[data-theme="dark"] button.green { background: #153c2c; color: var(--ink); }
    :root[data-theme="dark"] button.danger { background: #4a211c; color: var(--ink); }
    button.small { min-height: 30px; padding: 5px 8px; font-size: 13px; }
    button.icon { width: 34px; padding: 0; display: inline-grid; place-items: center; }

    input[type="number"], input[type="text"], input[type="search"], select {
      width: 100%;
      height: 34px;
      border: 2px solid var(--line);
      border-radius: 7px;
      padding: 5px 8px;
      background: var(--field);
      color: var(--ink);
      box-shadow: inset 0 2px 0 rgba(29,38,51,.06);
    }

    input[type="color"] {
      width: 100%;
      height: 34px;
      padding: 2px;
      border: 2px solid var(--line);
      border-radius: 7px;
      background: var(--field);
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 20px 14px;
      border-bottom: 3px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 6px 0 rgba(29,38,51,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .bearing-mark {
      width: 46px;
      height: 46px;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: linear-gradient(145deg, #f8fafc 0%, #95a3b0 34%, #e1e7ec 60%, #738291 100%);
      box-shadow: 3px 3px 0 rgba(29,38,51,.16);
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .bearing-mark::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 2px solid rgba(29,38,51,.68);
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.42);
    }

    .bearing-rotor {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      animation: bearing-spin 3.2s linear infinite;
      will-change: transform;
    }

    .bearing-ball {
      --angle: calc(var(--i) * 45deg);
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      margin: -3.5px;
      border: 1.5px solid var(--line);
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #8e9ba7);
      transform: rotate(var(--angle)) translateX(14px);
    }

    .bearing-ball:first-child { background: var(--accent); }

    .bearing-bore {
      position: absolute;
      inset: 13px;
      z-index: 2;
      border: 3px solid var(--line);
      border-radius: 50%;
      background: var(--panel);
      box-shadow: inset 2px 2px 0 rgba(29,38,51,.16);
    }

    :root[data-theme="dark"] .bearing-mark {
      background: linear-gradient(145deg, #d6dee6 0%, #657482 34%, #a8b4bf 60%, #4c5a68 100%);
    }

    @keyframes bearing-spin {
      to { transform: rotate(360deg); }
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .developer-credit {
      padding-left: 18px;
      border-left: 2px solid color-mix(in srgb, var(--line) 28%, transparent);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .top-action {
      min-width: 96px;
      font-weight: 800;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 10px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--ink);
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--good);
      border: 1px solid var(--line);
    }

    .main {
      display: grid;
      grid-template-columns:
        var(--side-pane-width, 330px)
        14px
        minmax(560px, 1fr)
        14px
        var(--view-pane-width, 430px);
      gap: 0;
      padding: 14px;
      min-height: 0;
      height: calc(100vh - 76px);
    }

    .pane-resizer {
      position: relative;
      min-width: 14px;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
      outline: none;
    }

    .pane-resizer::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 54px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--soft-line);
      transform: translate(-50%, -50%);
      transition: height .16s ease, background .16s ease;
    }

    .pane-resizer:hover::before,
    .pane-resizer:focus-visible::before,
    .pane-resizer.active::before {
      height: 76px;
      background: var(--accent);
    }

    body.resizing-panes,
    body.resizing-panes * {
      cursor: col-resize !important;
      user-select: none !important;
    }

    .panel {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 3px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow), 5px 5px 0 rgba(29,38,51,.10);
      min-height: 0;
    }

    .side {
      overflow: auto;
      padding: 14px;
    }

    .section {
      border-bottom: 2px dashed #d3dbe5;
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .section:last-child { border-bottom: 0; margin-bottom: 0; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .section-title h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 9px; }
    .preset-field { margin-bottom: 9px; }
    .preset-field input, .preset-field select { font-weight: 700; }
    .preset-field > label { display: block; margin-bottom: 5px; }

    .preset-combobox { position: relative; }
    .preset-combobox input { padding-right: 42px; }

    .preset-toggle {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 34px;
      min-height: 30px;
      padding: 0;
      border: 0;
      border-radius: 0 5px 5px 0;
      background: transparent;
      box-shadow: none;
      display: grid;
      place-items: center;
    }

    .preset-toggle:hover,
    .preset-toggle:focus-visible {
      background: var(--control-hover);
      outline: none;
    }

    .preset-toggle:active { transform: none; box-shadow: none; }

    .preset-chevron {
      width: 9px;
      height: 9px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translate(-1px, -1px);
      transition: transform .18s ease;
    }

    .preset-toggle[aria-expanded="true"] .preset-chevron {
      transform: rotate(225deg) translate(-1px, -1px);
    }

    .preset-popover {
      position: fixed;
      z-index: 80;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      max-height: 420px;
      border: 2px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      box-shadow: 0 5px 8px rgba(24,35,48,.22);
      overflow: hidden;
    }

    .preset-popover[hidden] { display: none; }

    .preset-list {
      min-height: 0;
      overflow: auto;
      padding: 4px;
      overscroll-behavior: contain;
    }

    .preset-option {
      width: 100%;
      min-height: 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      box-shadow: none;
      color: var(--ink);
      text-align: left;
      white-space: normal;
      transition: background .12s ease;
    }

    .preset-option + .preset-option { border-top: 1px solid var(--soft-line); }
    .preset-option:hover,
    .preset-option.active { background: var(--control-hover); }
    .preset-option:active { transform: none; box-shadow: none; }

    .preset-option-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .preset-option-size {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .preset-summary,
    .preset-empty {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .preset-summary {
      padding: 7px 10px;
      border-top: 1px solid var(--soft-line);
      background: var(--panel-2);
    }

    .preset-empty {
      padding: 18px 10px;
      text-align: center;
    }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
    .stack { display: grid; gap: 9px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 8px;
      border: 2px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }

    .workspace-panel {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 3px solid var(--line);
      background: var(--panel-2);
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      flex: 1 1 auto;
      min-width: 0;
    }

    .toolbar-right {
      flex: 0 0 auto;
    }

    .toolbar-right .status-pill {
      white-space: nowrap;
    }

    .canvas-wrap {
      position: relative;
      overflow: auto;
      display: grid;
      place-items: center;
      min-height: 430px;
      padding: 28px;
      background:
        radial-gradient(circle at 25% 15%, rgba(245,159,11,.12), transparent 28%),
        linear-gradient(135deg, var(--canvas-a), var(--canvas-b));
    }

    .pallet-board {
      position: relative;
      border: 4px solid var(--line);
      border-radius: 8px;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 8px, transparent 8px 18px),
        linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,.08)),
        var(--pallet);
      box-shadow: 0 12px 0 rgba(100, 60, 23, .35), 0 22px 28px rgba(29,38,51,.18);
      overflow: hidden;
      transform-origin: center center;
      flex: 0 0 auto;
    }

    .pallet-board::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(29,38,51,.16) 1px, transparent 1px),
        linear-gradient(0deg, rgba(29,38,51,.16) 1px, transparent 1px);
      background-size: var(--grid-size, 25px) var(--grid-size, 25px);
      opacity: var(--grid-opacity, .22);
      pointer-events: none;
    }

    .pallet-board::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 0;
      height: 100%;
      border-left: 2px dashed rgba(29,38,51,.42);
      box-shadow: 0 0 0 9999px transparent;
      pointer-events: none;
    }

    .midline-y {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      border-top: 2px dashed rgba(29,38,51,.42);
      pointer-events: none;
      z-index: 4;
    }

    .box-item {
      position: absolute;
      border: 3px solid var(--line);
      border-radius: 7px;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,255,255,.38) 0 3px, transparent 4px),
        linear-gradient(135deg, rgba(255,255,255,.22), rgba(0,0,0,.08)),
        var(--box);
      box-shadow: 4px 4px 0 rgba(29,38,51,.18);
      color: #fff;
      display: grid;
      place-items: center;
      text-align: center;
      user-select: none;
      touch-action: none;
      cursor: grab;
      z-index: 10;
      min-width: 22px;
      min-height: 22px;
    }

    .box-item.rotated { background-color: var(--box); }
    .box-item.selected {
      outline: 4px solid #ffe15b;
      outline-offset: 2px;
      z-index: 15;
    }
    .box-item.overlap { box-shadow: 0 0 0 4px rgba(214,75,66,.55), 4px 4px 0 rgba(29,38,51,.18); }

    .box-label {
      display: grid;
      gap: 1px;
      font-weight: 800;
      line-height: 1.05;
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
      pointer-events: none;
      font-size: clamp(10px, 1.4vw, 14px);
    }
    .box-label small { font-size: 11px; font-weight: 700; opacity: .92; }

    .snap-line {
      position: absolute;
      background: #ff4d4d;
      z-index: 30;
      pointer-events: none;
      box-shadow: 0 0 0 2px rgba(255,255,255,.55);
    }
    .snap-line.x { width: 2px; top: 0; bottom: 0; }
    .snap-line.y { height: 2px; left: 0; right: 0; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      border-top: 3px solid var(--line);
      background: var(--panel);
    }
    .metric {
      padding: 11px 12px;
      border-right: 2px solid #d9e0e8;
      min-width: 0;
    }
    .metric:last-child { border-right: 0; }
    .metric span { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric strong { display: block; margin-top: 3px; font-size: 18px; line-height: 1.1; }
    .metric.warning strong { color: var(--bad); }

    .plan-list {
      display: grid;
      gap: 8px;
    }

    .plan-card {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--panel);
      display: grid;
      gap: 7px;
    }
    .plan-card.active {
      background: color-mix(in srgb, var(--accent) 18%, var(--panel));
      box-shadow: inset 0 0 0 3px rgba(245,159,11,.32);
    }
    .plan-card.active p { color: #44505e; }
    :root[data-theme="dark"] .plan-card.active p { color: #d7e2ef; }
    .plan-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .plan-head strong { font-size: 14px; line-height: 1.2; }
    .plan-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .plan-proof {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      color: var(--good);
      font-weight: 800;
    }
    .plan-proof::before { content: "\2713"; }
    .plan-mini {
      width: 100%;
      aspect-ratio: var(--mini-ratio, 1.5);
      min-height: 118px;
      border: 2px solid #d5dde7;
      border-radius: 6px;
      background: var(--panel-2);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .view-panel {
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      overflow: hidden;
      min-height: 0;
    }

    .view-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 3px solid var(--line);
      background: var(--panel-2);
    }
    .view-head h2 { margin: 0; font-size: 16px; }
    .view-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

    #scene3d {
      min-height: 0;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    #scene3d canvas {
      width: 100%;
      height: 100%;
      display: block;
      min-height: 0;
    }

    .view-foot {
      border-top: 3px solid var(--line);
      padding: 12px;
      background: var(--panel);
      display: grid;
      gap: 10px;
    }

    .dimension-control {
      display: grid;
      grid-template-columns: minmax(160px, auto) 1fr;
      gap: 10px;
      align-items: center;
    }

    .dimension-readout {
      min-height: 45px;
      display: flex;
      align-items: center;
      padding: 9px 12px;
      border: 2px solid #d6dee8;
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--ink);
      font-weight: 800;
      line-height: 1.3;
    }

    .legend {
      display: none;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border: 2px solid var(--line);
      border-radius: 4px;
      flex: 0 0 auto;
    }

    .selected-info {
      min-height: 42px;
      padding: 9px;
      border: 2px solid #d6dee8;
      border-radius: 7px;
      background: var(--panel-2);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #1d2633;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;
      padding: 9px 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 999;
      font-size: 13px;
      visibility: hidden;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); visibility: visible; }

    @media (prefers-reduced-motion: reduce) {
      .bearing-rotor { animation: none; }
      .preset-chevron { transition: none; }
      .pane-resizer::before { transition: none; }
    }

    @media (max-width: 1240px) {
      .main { grid-template-columns: 310px minmax(520px, 1fr); gap: 14px; }
      .pane-resizer { display: none; }
      .view-panel { grid-column: 1 / -1; min-height: 560px; }
    }

    @media (max-width: 880px) {

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="bearing-mark" aria-hidden="true">
          <div class="bearing-rotor">
            <span class="bearing-ball" style="--i:0"></span>
            <span class="bearing-ball" style="--i:1"></span>
            <span class="bearing-ball" style="--i:2"></span>
            <span class="bearing-ball" style="--i:3"></span>
            <span class="bearing-ball" style="--i:4"></span>
            <span class="bearing-ball" style="--i:5"></span>
            <span class="bearing-ball" style="--i:6"></span>
            <span class="bearing-ball" style="--i:7"></span>
          </div>
          <span class="bearing-bore"></span>
        </div>
        <div>
          <h1>PHJY托盘箱子摆放规划器</h1>
          <p>自动排布、手动拖拽、磁吸对齐、3D 检查</p>
        </div>
        <span class="developer-credit" id="developerCredit">开发人员：JEFF</span>
      </div>
      <div class="statusbar">
        <button class="top-action" id="langToggle" type="button">EN</button>
        <button class="top-action" id="themeToggle" type="button">深色模式</button>
        <span hidden id="fitStatus">布局正常</span>
        <span hidden id="scaleReadout">比例 1:1</span>
      </div>
    </header>

    <main class="main">
      <aside class="panel side">
        <section class="section">
          <div class="section-title">
            <h2>托盘尺寸</h2>
            <button class="small blue" id="generatePallet">生成托盘</button>
          </div>
          <label class="preset-field"><span id="palletPresetLabel">托盘规格</span>
            <select id="palletPreset">
              <option value="large">大托盘 1200 × 800 × 140 mm</option>
              <option value="small">小托盘 800 × 600 × 140 mm</option>
            </select>
          </label>
          <div class="grid-3">
            <label>长 mm <input type="number" id="palletW" min="100" value="1200"></label>
            <label>宽 mm <input type="number" id="palletD" min="100" value="800"></label>
            <label>高 mm <input type="number" id="palletH" min="10" value="140"></label>
          </div>
          <div class="grid-2" style="margin-top:9px">
            <label>托盘重量 kg <input type="number" id="palletWeight" min="0" step="0.01" value="0"></label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">
            <h2>箱子尺寸</h2>
            <button class="small green" id="addBox">生成箱子</button>
          </div>
          <div class="preset-field">
            <label for="boxPreset" id="boxPresetLabel">箱型快速选择（1096 项）</label>
            <div class="preset-combobox" id="boxPresetCombo">
              <input type="search" id="boxPreset" autocomplete="off" placeholder="输入型号、名称或尺寸筛选"
                role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
                aria-expanded="false" aria-controls="boxPresetList">
              <button class="preset-toggle" id="boxPresetToggle" type="button"
                aria-label="展开箱型列表" aria-expanded="false" aria-controls="boxPresetList">
                <span class="preset-chevron" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="grid-3">
            <label>长 mm <input type="number" id="boxW" min="1" step="0.1" value="360"></label>
            <label>宽 mm <input type="number" id="boxD" min="1" step="0.1" value="215"></label>
            <label>高 mm <input type="number" id="boxH" min="1" step="0.1" value="90"></label>
          </div>
          <div class="grid-2" style="margin-top:9px">
            <label>层数 <input type="number" id="layers" min="1" max="12" value="3"></label>
            <label>每箱数量 <input type="number" id="perBox" min="0" value="880"></label>
            <label>单箱重量 kg <input type="number" id="boxWeight" min="0" step="0.01" value="0"></label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">
            <h2>颜色自定义</h2>
          </div>
          <div class="grid-2">
            <label>托盘 <input type="color" id="palletColor" value="#d8ad6a"></label>
            <label>箱子 <input type="color" id="boxColor" value="#4f8df6"></label>
          </div>
        </section>

        <section class="section">
          <div class="section-title">
            <h2>自动规划</h2>
            <button class="small primary" id="autoPlan">计算方案</button>
          </div>
          <div class="plan-list" id="planList"></div>
        </section>

        <section class="section">
          <div class="section-title">
            <h2>手动辅助</h2>
          </div>
          <div class="stack">
            <label class="toggle"><input type="checkbox" id="snapOn" checked> 磁吸开启</label>
            <div class="grid-2">
              <label>网格 mm <input type="number" id="gridSize" min="1" value="25"></label>
              <label>磁吸阈值 mm <input type="number" id="snapRange" min="1" value="16"></label>
            </div>
            <div class="grid-3">
              <button class="small" data-align="left">左齐</button>
              <button class="small" data-align="hcenter">水平居中</button>
              <button class="small" data-align="right">右齐</button>
              <button class="small" data-align="top">上齐</button>
              <button class="small" data-align="vcenter">垂直居中</button>
              <button class="small" data-align="bottom">下齐</button>
            </div>
            <div class="row">
              <button class="small blue" id="rotateBox">旋转选中</button>
              <button class="small green" id="centerLayout">整体居中</button>
              <button class="small danger" id="clearBoxes">清空箱子</button>
            </div>
            <div class="selected-info" id="selectedInfo">未选中箱子。点击箱子后可拖动、旋转或对齐。</div>
          </div>
        </section>
      </aside>

      <div class="pane-resizer" id="leftPaneResizer" data-pane-resizer="left"
        role="separator" aria-orientation="vertical" tabindex="0"
        aria-label="调整参数区和 2D 区宽度"></div>

      <section class="panel workspace-panel">
        <div class="toolbar">
          <div class="toolbar-left">
            <button class="primary" id="applyBest">应用首选方案</button>
            <button class="blue" id="addRow">补一排箱子</button>
            <button class="blue" id="rotateBoxToolbar">箱子旋转 90°</button>
            <button class="green" id="centerLayoutToolbar">整体居中</button>
          </div>
          <div class="toolbar-right">
            <span class="status-pill">2D 俯视手动规划</span>
          </div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <div class="pallet-board" id="palletBoard">
            <div class="midline-y"></div>
          </div>
        </div>

        <div class="metrics">
          <div class="metric"><span>单层箱数</span><strong id="boxCount">0</strong></div>
          <div class="metric"><span>整托箱数</span><strong id="totalBoxes">0</strong></div>
          <div class="metric"><span>整托数量</span><strong id="totalQty">0</strong></div>
          <div class="metric" id="totalWeightMetric"><span>总重量</span><strong id="totalWeight">0 kg</strong></div>
        </div>
      </section>

      <div class="pane-resizer" id="rightPaneResizer" data-pane-resizer="right"
        role="separator" aria-orientation="vertical" tabindex="0"
        aria-label="调整 2D 区和 3D 区宽度"></div>

      <aside class="panel view-panel">
        <div class="view-head">
          <div>
            <h2>3D 视角</h2>
            <p>鼠标拖动旋转，滚轮缩放；托盘按两孔木托盘结构建模，整体同色、外形尺寸一致。</p>
          </div>
          <button class="small blue" id="export3d">导出3D图</button>
        </div>
        <div id="scene3d" role="img" aria-label="3D 预览"></div>
        <div class="view-foot">
          <div class="dimension-control">
            <label class="toggle"><input type="checkbox" id="showDimensions3d" checked> 显示外形尺寸</label>
            <div class="dimension-readout" id="dimensionReadout">外形尺寸：1200 × 800 × 410 mm</div>
          </div>
          <label class="toggle"><input type="checkbox" id="palletOnly3d"> 只看托盘结构</label>
          <div class="legend">
            <div class="legend-item"><span class="swatch" id="legendPallet"></span>木托盘：同色顶板 + 三条纵向支撑，形成 2 个叉车孔</div>
            <div class="legend-item"><span class="swatch" id="legendBox"></span>箱子：统一颜色，方向用箱内尺寸文字区分</div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="preset-popover notranslate" id="boxPresetPopover" translate="no" hidden>
    <div class="preset-list" id="boxPresetList" role="listbox"></div>
    <p class="preset-summary" id="boxPresetSummary"></p>

    function setInputLabel(inputId, key) {
      const input = document.querySelector(`#${inputId}`);
      const label = input?.closest("label");
      if (!label) return;
      let textNode = [...label.childNodes].find(node => node.nodeType === Node.TEXT_NODE);
      if (!textNode) {
        textNode = document.createTextNode("");
        label.insertBefore(textNode, input);
      }
      const prefix = label.firstElementChild === input ? " " : "";
      const suffix = label.firstElementChild === input ? "" : " ";
      textNode.nodeValue = `${prefix}${t(key)}${suffix}`;
    }

    function normalizePresetSearch(value) {
      return String(value).toLocaleLowerCase().replace(/[×xX*]/g, "x").replace(/\s+/g, "");
    }

    function presetDisplayName(name) {
      return name.replace(/[（(]\s*\d+(?:\.\d+)?\s*[×xX*]\s*\d+(?:\.\d+)?\s*[×xX*]\s*\d+(?:\.\d+)?\s*[）)]/, "").trim() || name;
    }

    function matchingCartonPresets() {
      const query = normalizePresetSearch(els.boxPreset.value);
      if (!query) return BOX_PRESETS;
      return BOX_PRESETS
        .map((preset, sourceIndex) => {
          const [name, length, width, height] = preset;
          const normalizedName = normalizePresetSearch(name);
          const searchable = normalizePresetSearch(`${name} ${length}x${width}x${height}`);
          if (!searchable.includes(query)) return null;
          const nextCharacter = normalizedName.slice(query.length, query.length + 1);
          const exactModel = normalizedName.startsWith(query) && !/[a-z0-9]/i.test(nextCharacter);
          const rank = exactModel ? 0 : normalizedName.startsWith(query) ? 1 : 2;
          return { preset, rank, sourceIndex };
        })
        .filter(Boolean)
        .sort((a, b) => a.rank - b.rank || a.sourceIndex - b.sourceIndex)
        .map(match => match.preset);
    }

    function renderCartonPresetOptions() {
      state.presetMatches = matchingCartonPresets();
      state.presetActiveIndex = -1;
      els.boxPreset.removeAttribute("aria-activedescendant");
      const fragment = document.createDocumentFragment();

      state.presetMatches.forEach(([name, length, width, height], index) => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = "preset-option";
        option.id = `box-preset-option-${index}`;
        option.dataset.presetIndex = index;
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", "false");

        const title = document.createElement("span");
        title.className = "preset-option-name";
        title.textContent = presetDisplayName(name);

        const size = document.createElement("span");
        size.className = "preset-option-size";
        size.textContent = `${length} × ${width} × ${height}`;

        option.append(title, size);
        fragment.append(option);
      });

      if (!state.presetMatches.length) {
        const empty = document.createElement("p");
        empty.className = "preset-empty";
        empty.textContent = t("cartonNoMatches");
        fragment.append(empty);
      }

      els.boxPresetList.replaceChildren(fragment);
      els.boxPresetSummary.textContent = state.presetMatches.length
        ? t("cartonMatches", { count: state.presetMatches.length })
        : t("cartonNoMatches");
    }

    function positionCartonPresetPopover() {
      if (els.boxPresetPopover.hidden) return;
      const rect = els.boxPresetCombo.getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) {
        closeCartonPresetList();
        return;
      }

      const margin = 8;
      const gap = 6;
      const width = Math.min(Math.max(rect.width, 360), window.innerWidth - margin * 2);
      const left = clamp(rect.left, margin, window.innerWidth - width - margin);
      const below = window.innerHeight - rect.bottom - gap - margin;
      const above = rect.top - gap - margin;
      const placeBelow = below >= 220 || below >= above;
      const available = Math.max(150, placeBelow ? below : above);
      const maxHeight = Math.min(420, available);

      els.boxPresetPopover.style.width = `${width}px`;
      els.boxPresetPopover.style.maxHeight = `${maxHeight}px`;
      els.boxPresetPopover.style.left = `${left}px`;
      const renderedHeight = Math.min(els.boxPresetPopover.scrollHeight, maxHeight);
      els.boxPresetPopover.style.top = placeBelow
        ? `${rect.bottom + gap}px`
        : `${Math.max(margin, rect.top - gap - renderedHeight)}px`;
    }

    function openCartonPresetList() {
      renderCartonPresetOptions();
      els.boxPresetPopover.hidden = false;
      els.boxPreset.setAttribute("aria-expanded", "true");
      els.boxPresetToggle.setAttribute("aria-expanded", "true");
      const label = t("cartonDropdownClose");
      els.boxPresetToggle.setAttribute("aria-label", label);
      els.boxPresetToggle.title = label;
      positionCartonPresetPopover();
    }

    function closeCartonPresetList() {
      if (els.boxPresetPopover.hidden) return;
      els.boxPresetPopover.hidden = true;
      els.boxPreset.setAttribute("aria-expanded", "false");
      els.boxPreset.removeAttribute("aria-activedescendant");
      els.boxPresetToggle.setAttribute("aria-expanded", "false");
      const label = t("cartonDropdownOpen");
      els.boxPresetToggle.setAttribute("aria-label", label);
      els.boxPresetToggle.title = label;
      state.presetActiveIndex = -1;
    }

    function setActiveCartonPreset(index) {
      const options = [...els.boxPresetList.querySelectorAll(".preset-option")];
      if (!options.length) return;
      const nextIndex = (index + options.length) % options.length;
      options.forEach((option, optionIndex) => {
        const active = optionIndex === nextIndex;
        option.classList.toggle("active", active);
        option.setAttribute("aria-selected", String(active));
      });
      state.presetActiveIndex = nextIndex;
      const activeOption = options[nextIndex];
      els.boxPreset.setAttribute("aria-activedescendant", activeOption.id);
      activeOption.scrollIntoView({ block: "nearest" });
    }

    function selectCartonPreset(preset) {
      if (!preset) return;
      els.boxPreset.value = preset[0];
      applyCartonPreset(preset);
      closeCartonPresetList();
      els.boxPreset.focus();
    }

    function handleCartonPresetKeydown(event) {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        event.stopPropagation();
        if (els.boxPresetPopover.hidden) openCartonPresetList();
        const step = event.key === "ArrowDown" ? 1 : -1;
        const start = state.presetActiveIndex < 0 && step < 0 ? 0 : state.presetActiveIndex;
        setActiveCartonPreset(start + step);
        return;
      }
      if (event.key === "Enter" && !els.boxPresetPopover.hidden && state.presetActiveIndex >= 0) {
        event.preventDefault();
        event.stopPropagation();
        selectCartonPreset(state.presetMatches[state.presetActiveIndex]);
        return;
      }
      if (event.key === "Escape" && !els.boxPresetPopover.hidden) {
        event.preventDefault();
        event.stopPropagation();
        closeCartonPresetList();
      } else if (event.key === "Tab") {
        closeCartonPresetList();
      }
    }

    function syncPalletPresetFromDimensions() {
      const dimensions = [Number(els.palletW.value), Number(els.palletD.value), Number(els.palletH.value)];
      const match = [...PALLET_PRESETS].find(([, preset]) => preset.every((value, index) => value === dimensions[index]));
      els.palletPreset.value = match?.[0] || "";
    }

    function applyPalletPreset() {
      const preset = PALLET_PRESETS.get(els.palletPreset.value);
      if (!preset) return;
      [els.palletW.value, els.palletD.value, els.palletH.value] = preset;
      calculatePlans();
    }

      els.boxPreset.value = "";
