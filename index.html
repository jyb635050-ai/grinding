    function applyCartonPreset(selectedPreset = null) {
      const name = els.boxPreset.value.trim();
      const preset = selectedPreset || BOX_PRESET_BY_NAME.get(name);
      if (!preset) return;
      const [, length, width, height] = preset;
      const unchanged =
        els.boxPreset.dataset.applied === name &&
        Number(els.boxW.value) === length &&
        Number(els.boxD.value) === width &&
        Number(els.boxH.value) === height;
      if (unchanged) return;
      els.boxPreset.dataset.applied = name;
      els.boxW.value = length;
      els.boxD.value = width;
      els.boxH.value = height;
      calculatePlans();
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
      localStorage.setItem("palletPlannerTheme", state.theme);
      els.themeToggle.textContent = t(state.theme === "dark" ? "themeLight" : "themeDark");
      if (scene) {
        scene.background = new THREE.Color(0xffffff);
      }
      if (floorMesh) {
        floorMesh.material.color.set(0xffffff);
      }
      schedule3D();
    }

    const PANE_LAYOUT = Object.freeze({
      breakpoint: 1240,
      defaultLeft: 330,
      defaultRight: 430,
      minLeft: 280,
      minRight: 340,
      minCenter: 560,
      keyboardStep: 20,
    });

    function isResizablePaneLayout() {
      return window.innerWidth > PANE_LAYOUT.breakpoint;
    }

    function paneAvailableWidth() {
      const style = getComputedStyle(els.main);
      const horizontalPadding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const handleWidth = els.paneResizers.reduce(
        (sum, resizer) => sum + resizer.getBoundingClientRect().width,
        0
      ) || 28;
      const containerWidth = Math.min(els.main.clientWidth, document.documentElement.clientWidth);
      return containerWidth - horizontalPadding - handleWidth;
    }

    function currentPaneWidths() {
      return {
        left: els.sidePane.getBoundingClientRect().width,
        right: els.viewPane.getBoundingClientRect().width,
      };
    }

    function constrainPaneWidths(left, right, changedPane = null) {
      const maximumCombined = Math.max(
        PANE_LAYOUT.minLeft + PANE_LAYOUT.minRight,
        paneAvailableWidth() - PANE_LAYOUT.minCenter
      );
      let nextLeft = Number(left) || PANE_LAYOUT.defaultLeft;
      let nextRight = Number(right) || PANE_LAYOUT.defaultRight;

      if (changedPane === "left") {
        nextRight = clamp(nextRight, PANE_LAYOUT.minRight, maximumCombined - PANE_LAYOUT.minLeft);
        nextLeft = clamp(nextLeft, PANE_LAYOUT.minLeft, maximumCombined - nextRight);
      } else if (changedPane === "right") {
        nextLeft = clamp(nextLeft, PANE_LAYOUT.minLeft, maximumCombined - PANE_LAYOUT.minRight);
        nextRight = clamp(nextRight, PANE_LAYOUT.minRight, maximumCombined - nextLeft);
      } else {
        nextLeft = clamp(nextLeft, PANE_LAYOUT.minLeft, maximumCombined - PANE_LAYOUT.minRight);
        nextRight = clamp(nextRight, PANE_LAYOUT.minRight, maximumCombined - nextLeft);
      }

      return { left: nextLeft, right: nextRight, maximumCombined };
    }

    function updatePaneResizerAria(left, right, maximumCombined) {
      els.paneResizers.forEach(resizer => {
        const isLeft = resizer.dataset.paneResizer === "left";
        const value = isLeft ? left : right;
        const maximum = maximumCombined - (isLeft ? right : left);
        resizer.setAttribute("aria-valuemin", String(isLeft ? PANE_LAYOUT.minLeft : PANE_LAYOUT.minRight));
        resizer.setAttribute("aria-valuemax", String(Math.round(maximum)));
        resizer.setAttribute("aria-valuenow", String(Math.round(value)));
        resizer.setAttribute("aria-valuetext", Math.round(value) + " px");
      });
    }

    function schedulePaneLayoutRender() {
      if (state.paneRenderQueued) return;
      state.paneRenderQueued = true;
      requestAnimationFrame(() => {
        state.paneRenderQueued = false;
        render2D();
        positionCartonPresetPopover();
      });
    }

    function applyPaneLayout(left, right, { changedPane = null, remember = false } = {}) {
      if (!isResizablePaneLayout()) return;
      const constrained = constrainPaneWidths(left, right, changedPane);
      els.main.style.setProperty("--side-pane-width", constrained.left + "px");
      els.main.style.setProperty("--view-pane-width", constrained.right + "px");
      updatePaneResizerAria(constrained.left, constrained.right, constrained.maximumCombined);
      if (remember) {
        state.panePreference = { left: constrained.left, right: constrained.right };
        localStorage.setItem("palletPlannerPaneWidths", JSON.stringify(state.panePreference));
      }
      schedulePaneLayoutRender();
    }

    function restorePaneLayout() {
      try {
        const saved = JSON.parse(localStorage.getItem("palletPlannerPaneWidths") || "null");
        if (saved && Number(saved.left) > 0 && Number(saved.right) > 0) {
          state.panePreference = { left: Number(saved.left), right: Number(saved.right) };
        }
      } catch {
        localStorage.removeItem("palletPlannerPaneWidths");
      }
      applyPaneLayout(state.panePreference.left, state.panePreference.right);
    }

    function startPaneResize(event) {
      if (!isResizablePaneLayout() || event.button !== 0) return;
      const widths = currentPaneWidths();
      state.paneResize = {
        side: event.currentTarget.dataset.paneResizer,
        startX: event.clientX,
        startLeft: widths.left,
        startRight: widths.right,
        pointerId: event.pointerId,
        handle: event.currentTarget,
      };
      event.currentTarget.classList.add("active");
      event.currentTarget.setPointerCapture(event.pointerId);
      document.body.classList.add("resizing-panes");
      closeCartonPresetList();
      event.preventDefault();
    }

    function movePaneResize(event) {
      if (!state.paneResize || event.pointerId !== state.paneResize.pointerId) return;
      const delta = event.clientX - state.paneResize.startX;
      const left = state.paneResize.side === "left"
        ? state.paneResize.startLeft + delta
        : state.paneResize.startLeft;
      const right = state.paneResize.side === "right"
        ? state.paneResize.startRight - delta
        : state.paneResize.startRight;
      applyPaneLayout(left, right, { changedPane: state.paneResize.side });
    }

    function finishPaneResize(event) {
      if (!state.paneResize || event.pointerId !== state.paneResize.pointerId) return;
      const { handle, pointerId, side } = state.paneResize;
      if (handle.hasPointerCapture(pointerId)) handle.releasePointerCapture(pointerId);
      handle.classList.remove("active");
      document.body.classList.remove("resizing-panes");
      state.paneResize = null;
      const widths = currentPaneWidths();
      applyPaneLayout(widths.left, widths.right, { changedPane: side, remember: true });
    }

    function resetPaneLayout() {
      state.panePreference = { left: PANE_LAYOUT.defaultLeft, right: PANE_LAYOUT.defaultRight };
      applyPaneLayout(state.panePreference.left, state.panePreference.right, { remember: true });
      showToast(t("paneLayoutReset"));
    }

    function handlePaneResizerKeydown(event) {
      if (!isResizablePaneLayout()) return;
      if (event.key === "Home") {
        event.preventDefault();
        resetPaneLayout();
        return;
      }
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      event.stopPropagation();
      const direction = event.key === "ArrowRight" ? 1 : -1;
      const delta = direction * (event.shiftKey ? 50 : PANE_LAYOUT.keyboardStep);
      const widths = currentPaneWidths();
      if (event.currentTarget.dataset.paneResizer === "left") {
        applyPaneLayout(widths.left + delta, widths.right, { changedPane: "left", remember: true });
      } else {
        applyPaneLayout(widths.left, widths.right - delta, { changedPane: "right", remember: true });
      }
    }

    function handlePaneViewportResize() {
      if (state.paneResize) {
        state.paneResize.handle.classList.remove("active");
        state.paneResize = null;
        document.body.classList.remove("resizing-panes");
      }
      if (isResizablePaneLayout()) {
        applyPaneLayout(state.panePreference.left, state.panePreference.right);
      } else {
        schedulePaneLayoutRender();
      }
    }

    function readForm() {
      state.pallet.w = Math.max(100, Number(els.palletW.value) || 1200);
      state.pallet.d = Math.max(100, Number(els.palletD.value) || 800);
      state.pallet.h = Math.max(10, Number(els.palletH.value) || 140);
      state.palletWeight = Math.max(0, Number(els.palletWeight.value) || 0);
      state.box.w = Math.max(1, Number(els.boxW.value) || 360);
      state.box.d = Math.max(1, Number(els.boxD.value) || 215);
      state.box.h = Math.max(1, Number(els.boxH.value) || 90);
      state.boxWeight = Math.max(0, Number(els.boxWeight.value) || 0);
      state.layers = clamp(Number(els.layers.value) || 1, 1, 12);
      state.perBox = Math.max(0, Number(els.perBox.value) || 0);
      state.colors.pallet = els.palletColor.value;
      state.colors.box = els.boxColor.value;
      state.showDimensions = els.showDimensions3d.checked;
      document.documentElement.style.setProperty("--pallet", state.colors.pallet);
      document.documentElement.style.setProperty("--box", state.colors.box);
      els.legendPallet.style.background = state.colors.pallet;
      els.legendBox.style.background = state.colors.box;
      updateDimensionReadout();
    }

    function visibleOuterDimensions() {
      const showLoad = !document.querySelector("#palletOnly3d")?.checked && state.layout.length > 0;
      return {
        l: state.pallet.w,
        w: state.pallet.d,
        h: state.pallet.h + (showLoad ? state.layers * state.box.h : 0),
      };
    }

    function updateDimensionReadout() {
      if (!els.dimensionReadout) return;
      const dims = visibleOuterDimensions();
      els.dimensionReadout.textContent = t("outerSize", {
        l: fmt(Math.round(dims.l)),
        w: fmt(Math.round(dims.w)),
        h: fmt(Math.round(dims.h)),
      });
    }

    function fitScale() {
      const maxW = Math.max(360, els.wrap.clientWidth - 80);
      const maxH = Math.max(280, els.wrap.clientHeight - 80);
      state.scale = Math.min(maxW / state.pallet.w, maxH / state.pallet.d, 0.82);
      els.board.style.width = `${state.pallet.w * state.scale}px`;
      els.board.style.height = `${state.pallet.d * state.scale}px`;
      const gridPx = Math.max(5, Number(els.gridSize.value || 25) * state.scale);
      els.board.style.setProperty("--grid-size", `${gridPx}px`);
      els.scaleReadout.textContent = t("scaleReadout", { scale: state.scale.toFixed(2) });
    }

    function boxColor(box) {
      return state.colors.box;
    }

    function render2D() {
      fitScale();
      els.board.querySelectorAll(".box-item,.snap-line").forEach(node => node.remove());
      const overlaps = collectOverlaps();

      state.layout.forEach((box, index) => {
        const div = document.createElement("div");
        div.className = `box-item ${box.rotated ? "rotated" : ""} ${box.id === state.selectedId ? "selected" : ""} ${overlaps.has(box.id) ? "overlap" : ""}`;
        div.dataset.id = box.id;
        div.style.left = `${box.x * state.scale}px`;
        div.style.top = `${box.y * state.scale}px`;
        div.style.width = `${box.w * state.scale}px`;
        div.style.height = `${box.d * state.scale}px`;
        div.style.backgroundColor = boxColor(box);
        div.innerHTML = `<span class="box-label">${index + 1}<small>${Math.round(box.w)}×${Math.round(box.d)}</small></span>`;
        div.addEventListener("pointerdown", startDrag);
        div.addEventListener("dblclick", () => rotateBox(box.id));
        els.board.appendChild(div);
      });

      updateMetrics(overlaps);
      updateSelectedInfo();
      schedule3D();
    }

    function showSnapLines(lines) {
      els.board.querySelectorAll(".snap-line").forEach(node => node.remove());
      lines.forEach(line => {
        const div = document.createElement("div");
        div.className = `snap-line ${line.axis}`;
        if (line.axis === "x") div.style.left = `${line.value * state.scale}px`;
        if (line.axis === "y") div.style.top = `${line.value * state.scale}px`;
        els.board.appendChild(div);
      });
    }

    function startDrag(event) {
      const id = event.currentTarget.dataset.id;
      const box = state.layout.find(item => item.id === id);
      if (!box) return;
      state.selectedId = id;
      const rect = els.board.getBoundingClientRect();
      state.dragging = {
        id,
        offsetX: (event.clientX - rect.left) / state.scale - box.x,
        offsetY: (event.clientY - rect.top) / state.scale - box.y,
      };
      event.currentTarget.setPointerCapture(event.pointerId);
      window.addEventListener("pointermove", dragMove);
      window.addEventListener("pointerup", endDrag, { once: true });
      render2D();
    }

    function dragMove(event) {
      if (!state.dragging) return;
      const box = state.layout.find(item => item.id === state.dragging.id);
      if (!box) return;
      const rect = els.board.getBoundingClientRect();
      let x = (event.clientX - rect.left) / state.scale - state.dragging.offsetX;
      let y = (event.clientY - rect.top) / state.scale - state.dragging.offsetY;
      x = clamp(x, 0, state.pallet.w - box.w);
      y = clamp(y, 0, state.pallet.d - box.d);

      let lines = [];
      if (els.snapOn.checked) {
        const snapped = snapPosition(box, x, y);
        x = snapped.x;
        y = snapped.y;
        lines = snapped.lines;
      }
      box.x = x;
      box.y = y;
      const node = els.board.querySelector(`[data-id="${box.id}"]`);
      if (node) {
        node.style.left = `${box.x * state.scale}px`;
        node.style.top = `${box.y * state.scale}px`;
      }
      showSnapLines(lines);
      updateMetrics(collectOverlaps());
      updateSelectedInfo();
      schedule3D();
    }

    function endDrag() {
      state.dragging = null;
      els.board.querySelectorAll(".snap-line").forEach(node => node.remove());
      render2D();
    }

    function snapPosition(box, x, y) {
      const range = Math.max(1, Number(els.snapRange.value) || 16);
      const grid = Math.max(1, Number(els.gridSize.value) || 25);
      const lines = [];

      x = Math.round(x / grid) * grid;
      y = Math.round(y / grid) * grid;

      const xAnchors = [
        { value: 0, type: "left" },
        { value: state.pallet.w / 2, type: "center" },
        { value: state.pallet.w, type: "right" },
      ];
      const yAnchors = [
        { value: 0, type: "top" },
        { value: state.pallet.d / 2, type: "middle" },
        { value: state.pallet.d, type: "bottom" },
      ];

      state.layout.forEach(other => {
        if (other.id === box.id) return;
        xAnchors.push({ value: other.x, type: "left" }, { value: other.x + other.w / 2, type: "center" }, { value: other.x + other.w, type: "right" });
        yAnchors.push({ value: other.y, type: "top" }, { value: other.y + other.d / 2, type: "middle" }, { value: other.y + other.d, type: "bottom" });
      });

      const xPoints = [
        { type: "left", value: x, offset: 0 },
        { type: "center", value: x + box.w / 2, offset: box.w / 2 },
        { type: "right", value: x + box.w, offset: box.w },
      ];
      const yPoints = [
        { type: "top", value: y, offset: 0 },
        { type: "middle", value: y + box.d / 2, offset: box.d / 2 },
        { type: "bottom", value: y + box.d, offset: box.d },
      ];

      let bestX = null;
      for (const p of xPoints) {
        for (const a of xAnchors) {
          const diff = Math.abs(p.value - a.value);
          if (diff <= range && (!bestX || diff < bestX.diff)) bestX = { diff, x: a.value - p.offset, line: a.value };
        }
      }
      let bestY = null;
      for (const p of yPoints) {
        for (const a of yAnchors) {
          const diff = Math.abs(p.value - a.value);
          if (diff <= range && (!bestY || diff < bestY.diff)) bestY = { diff, y: a.value - p.offset, line: a.value };
        }
      }

      if (bestX) {
        x = bestX.x;
        lines.push({ axis: "x", value: bestX.line });
      }
      if (bestY) {
        y = bestY.y;
        lines.push({ axis: "y", value: bestY.line });
      }

      x = clamp(x, 0, state.pallet.w - box.w);
      y = clamp(y, 0, state.pallet.d - box.d);
      return { x, y, lines };
    }

    function collectOverlaps() {
      const bad = new Set();
      for (let i = 0; i < state.layout.length; i++) {
        const a = state.layout[i];
        for (let j = i + 1; j < state.layout.length; j++) {
          const b = state.layout[j];
          const overlap = !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.d <= b.y || b.y + b.d <= a.y);
          if (overlap) {
            bad.add(a.id);
            bad.add(b.id);
          }
        }
      }
      return bad;
    }

    function updateMetrics(overlaps) {
      const layerCount = state.layout.length;
      const totalBoxes = layerCount * state.layers;
      const totalWeight = state.palletWeight + totalBoxes * state.boxWeight;
      els.boxCount.textContent = fmt(layerCount);
      els.totalBoxes.textContent = fmt(totalBoxes);
      els.totalQty.textContent = fmt(totalBoxes * state.perBox);
      els.totalWeight.textContent = fmtWeight(totalWeight);

      const outside = state.layout.some(box => box.x < -0.01 || box.y < -0.01 || box.x + box.w > state.pallet.w + 0.01 || box.y + box.d > state.pallet.d + 0.01);
      if (overlaps.size || outside) {
        els.fitStatus.textContent = t("needsCheck");
      } else {
        els.fitStatus.textContent = t("normal");
      }
    }

    function updateSelectedInfo() {
      const box = state.layout.find(item => item.id === state.selectedId);
      if (!box) {
        els.selectedInfo.textContent = t("selectedNone");
        return;
      }
      const idx = state.layout.indexOf(box) + 1;
      els.selectedInfo.textContent = t("selectedBox", {
        index: idx,
        x: Math.round(box.x),
        y: Math.round(box.y),
        w: Math.round(box.w),
        d: Math.round(box.d),
        direction: box.rotated ? t("dirRotated") : t("dirNormal"),
      });
    }

    function addBox(rotated = false, x = null, y = null) {
      const w = rotated ? state.box.d : state.box.w;
      const d = rotated ? state.box.w : state.box.d;
      const box = {
        id: uid(),
        x: x ?? clamp((state.pallet.w - w) / 2, 0, Math.max(0, state.pallet.w - w)),
        y: y ?? clamp((state.pallet.d - d) / 2, 0, Math.max(0, state.pallet.d - d)),
        w,
        d,
        rotated,
      };
      state.layout.push(box);
      state.selectedId = box.id;
      state.activePlan = null;
      renderPlans();
      render2D();
    }

    function copySelectedBox() {
      const box = state.layout.find(item => item.id === state.selectedId);
      if (!box) return false;
      state.copiedBox = {
        x: box.x,
        y: box.y,
        w: box.w,
        d: box.d,
        rotated: box.rotated,
      };
      state.pasteCount = 0;
      showToast(t("boxCopied"));
      return true;
    }

    function findPastePlacement(template) {
      const maxX = Math.max(0, state.pallet.w - template.w);
      const maxY = Math.max(0, state.pallet.d - template.d);
      const step = Math.max(1, Number(els.gridSize.value) || 25);
      const offset = step * ((state.pasteCount % 4) + 1);
      const preferred = {
        x: clamp(template.x + offset, 0, maxX),
        y: clamp(template.y + offset, 0, maxY),
      };
      const candidates = [preferred];

      state.layout.forEach(box => {
        candidates.push(
          { x: box.x + box.w, y: box.y },
          { x: box.x, y: box.y + box.d },
          { x: box.x - template.w, y: box.y },
          { x: box.x, y: box.y - template.d },
        );
      });

      for (let y = 0; y <= maxY + 0.001; y += step) {
        for (let x = 0; x <= maxX + 0.001; x += step) {
          candidates.push({ x, y });
        }
      }
      candidates.push({ x: maxX, y: maxY });

      const seen = new Set();
      for (const position of candidates) {
        const x = clamp(position.x, 0, maxX);
        const y = clamp(position.y, 0, maxY);
        const key = `${Math.round(x * 1000)}:${Math.round(y * 1000)}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const candidate = { ...template, x, y };
        const inside = candidate.w <= state.pallet.w + 0.001 && candidate.d <= state.pallet.d + 0.001;
        if (inside && !state.layout.some(box => rectanglesOverlap(candidate, box))) {
          return { x, y, overlaps: false };
        }
      }
      return { ...preferred, overlaps: true };
    }

    function pasteCopiedBox() {
      if (!state.copiedBox) return false;
      const template = state.copiedBox;
      const placement = findPastePlacement(template);
      const box = {
        id: uid(),
        x: placement.x,
        y: placement.y,
        w: template.w,
        d: template.d,
        rotated: template.rotated,
      };
      state.layout.push(box);
      state.selectedId = box.id;
      state.pasteCount += 1;
      state.activePlan = null;
      renderPlans();
      render2D();
      showToast(t(placement.overlaps ? "boxPastedOverlap" : "boxPasted"));
      return true;
    }

    function deleteSelectedBox() {
      const index = state.layout.findIndex(item => item.id === state.selectedId);
      if (index < 0) return false;
      state.layout.splice(index, 1);
      state.selectedId = null;
      state.activePlan = null;
      renderPlans();
      render2D();
      showToast(t("boxDeleted"));
      return true;
    }

    function isEditableTarget(target) {
      return target instanceof Element && Boolean(target.closest('input, textarea, select, [contenteditable="true"]'));
    }

    function handleKeyboardShortcuts(event) {
      if (event.defaultPrevented || event.repeat || isEditableTarget(event.target)) return;
      const key = event.key.toLowerCase();
      const modifier = event.ctrlKey || event.metaKey;

      if (event.key === "Delete" && !modifier && !event.altKey && state.selectedId) {
        event.preventDefault();
        deleteSelectedBox();
        return;
      }
      if (modifier && !event.altKey && key === "c" && state.selectedId) {
        event.preventDefault();
        copySelectedBox();
        return;
      }
      if (modifier && !event.altKey && key === "v" && state.copiedBox) {
        event.preventDefault();
        pasteCopiedBox();
      }
    }

    function rotateBox(id = state.selectedId) {
      const box = state.layout.find(item => item.id === id);
      if (!box) return showToast(t("selectBoxFirst"));
      const centerX = box.x + box.w / 2;
      const centerY = box.y + box.d / 2;
      box.rotated = !box.rotated;
      box.w = box.rotated ? state.box.d : state.box.w;
      box.d = box.rotated ? state.box.w : state.box.d;
      box.x = clamp(centerX - box.w / 2, 0, Math.max(0, state.pallet.w - box.w));
      box.y = clamp(centerY - box.d / 2, 0, Math.max(0, state.pallet.d - box.d));
      state.activePlan = null;
      renderPlans();
      render2D();
    }

    function alignSelected(type) {
      const box = state.layout.find(item => item.id === state.selectedId);
      if (!box) return showToast(t("selectBoxFirst"));
      if (type === "left") box.x = 0;
      if (type === "right") box.x = state.pallet.w - box.w;
      if (type === "hcenter") box.x = (state.pallet.w - box.w) / 2;
      if (type === "top") box.y = 0;
      if (type === "bottom") box.y = state.pallet.d - box.d;
      if (type === "vcenter") box.y = (state.pallet.d - box.d) / 2;
      state.activePlan = null;
      renderPlans();
      render2D();
    }

    function centerLayout() {
      if (!state.layout.length) return;
      const minX = Math.min(...state.layout.map(b => b.x));
      const minY = Math.min(...state.layout.map(b => b.y));
      const maxX = Math.max(...state.layout.map(b => b.x + b.w));
      const maxY = Math.max(...state.layout.map(b => b.y + b.d));
      const dx = (state.pallet.w - (maxX - minX)) / 2 - minX;
      const dy = (state.pallet.d - (maxY - minY)) / 2 - minY;
      state.layout.forEach(box => {
        box.x = clamp(box.x + dx, 0, Math.max(0, state.pallet.w - box.w));
        box.y = clamp(box.y + dy, 0, Math.max(0, state.pallet.d - box.d));
      });
      state.activePlan = null;
      renderPlans();
      render2D();
      showToast(t("centeredToast"));
    }

    function addRow() {
      const y = findNextRowY();
      if (y == null) return showToast(t("noSpaceRow"));
      const count = Math.floor(state.pallet.w / state.box.w);
      const rowW = count * state.box.w;
      const x0 = (state.pallet.w - rowW) / 2;
      for (let i = 0; i < count; i++) addSilentBox(false, x0 + i * state.box.w, y);
      state.activePlan = null;
      renderPlans();
      render2D();
    }

    function findNextRowY() {
      const usedBottom = state.layout.length ? Math.max(...state.layout.map(b => b.y + b.d)) : 0;
      if (usedBottom + state.box.d <= state.pallet.d) return usedBottom;
      const usedTop = state.layout.length ? Math.min(...state.layout.map(b => b.y)) : state.pallet.d;
      if (usedTop - state.box.d >= 0) return usedTop - state.box.d;
      return null;
    }

    function addSilentBox(rotated, x, y) {
      state.layout.push({
        id: uid(),
        x,
        y,
        w: rotated ? state.box.d : state.box.w,
        d: rotated ? state.box.w : state.box.d,
        rotated,
      });
    }

    function rectanglesOverlap(a, b) {
      const epsilon = 0.001;
      return !(
        a.x + a.w <= b.x + epsilon ||
        b.x + b.w <= a.x + epsilon ||
        a.y + a.d <= b.y + epsilon ||
        b.y + b.d <= a.y + epsilon
      );
    }

    function centerRectangles(rects) {
      if (!rects.length) return [];
      const minX = Math.min(...rects.map(rect => rect.x));
      const minY = Math.min(...rects.map(rect => rect.y));
      const maxX = Math.max(...rects.map(rect => rect.x + rect.w));
      const maxY = Math.max(...rects.map(rect => rect.y + rect.d));
      const offsetX = (state.pallet.w - (maxX - minX)) / 2 - minX;
      const offsetY = (state.pallet.d - (maxY - minY)) / 2 - minY;
      return rects.map(rect => ({ ...rect, x: rect.x + offsetX, y: rect.y + offsetY }));
    }

    function searchSpatialLayout(seedRects) {
      const palletW = state.pallet.w;
      const palletD = state.pallet.d;
      const boxArea = state.box.w * state.box.d;
      const upperBound = Math.floor((palletW * palletD + 0.001) / boxArea);
      const seedCount = seedRects.length;
      const maxSearchBoxes = 60;
      const maxNodes = 30000;
      const timeLimitMs = 140;
      const startedAt = performance.now();
      const epsilon = 0.001;
      let best = seedRects.map(rect => ({ ...rect }));
      let nodes = 0;
      let timedOut = false;
      const seen = new Set();

      if (seedCount >= upperBound || upperBound > maxSearchBoxes) {
        return {
          rects: centerRectangles(best),
          upperBound,
          provenOptimal: seedCount >= upperBound,
          improved: false,
          timedOut: false,
        };
      }

      const orientations = state.box.w === state.box.d
        ? [{ w: state.box.w, d: state.box.d, rotated: false }]
        : [
            { w: state.box.w, d: state.box.d, rotated: false },
            { w: state.box.d, d: state.box.w, rotated: true },
          ];
      const fittingOrientations = orientations.filter(
        orientation => orientation.w <= palletW + epsilon && orientation.d <= palletD + epsilon,
      );
      if (!fittingOrientations.length) {
        return {
          rects: centerRectangles(best),
          upperBound,
          provenOptimal: best.length >= upperBound,
          improved: false,
          timedOut: false,
        };
      }
      const coordinateKey = value => Math.round(value * 1000);
      const rectangleKey = rect => `${coordinateKey(rect.x)}:${coordinateKey(rect.y)}:${coordinateKey(rect.w)}:${coordinateKey(rect.d)}`;
      const layoutKey = rects => rects.map(rectangleKey).sort().join("|");

      const search = placed => {
        nodes += 1;
        if (nodes > maxNodes || ((nodes & 127) === 0 && performance.now() - startedAt > timeLimitMs)) {
          timedOut = true;
          return true;
        }

        if (placed.length > best.length) {
          best = placed.map(rect => ({ ...rect }));
          if (best.length >= upperBound) return true;
        }

        const signature = layoutKey(placed);
        if (seen.has(signature)) return false;
        seen.add(signature);

        const xPositions = [...new Set([0, ...placed.map(rect => rect.x + rect.w)])];
        const yPositions = [...new Set([0, ...placed.map(rect => rect.y + rect.d)])];
        const candidateMap = new Map();

        orientations.forEach(orientation => {
          xPositions.forEach(x => {
            yPositions.forEach(y => {
              if (x + orientation.w > palletW + epsilon || y + orientation.d > palletD + epsilon) return;
              const rect = { x, y, ...orientation };
              if (placed.some(other => rectanglesOverlap(rect, other))) return;

              let contacts = Number(x <= epsilon) + Number(y <= epsilon);
              contacts += Number(Math.abs(x + rect.w - palletW) <= epsilon);
              contacts += Number(Math.abs(y + rect.d - palletD) <= epsilon);
              placed.forEach(other => {
                contacts += Number(Math.abs(x - (other.x + other.w)) <= epsilon);
                contacts += Number(Math.abs(y - (other.y + other.d)) <= epsilon);
              });

              const key = rectangleKey(rect);
              const score = contacts * 1000000 - y * palletW - x;
              const current = candidateMap.get(key);
              if (!current || current.score < score) candidateMap.set(key, { rect, score });
            });
          });
        });

        const candidates = [...candidateMap.values()].sort((a, b) => b.score - a.score);
        for (const candidate of candidates) {
          placed.push(candidate.rect);
          const shouldStop = search(placed);
          placed.pop();
          if (shouldStop && (best.length >= upperBound || timedOut)) return true;
        }
        return false;
      };

      for (const orientation of fittingOrientations) {
        search([{ x: 0, y: 0, ...orientation }]);
        if (best.length >= upperBound || timedOut) break;
      }

      return {
        rects: centerRectangles(best),
        upperBound,
        provenOptimal: best.length >= upperBound,
        improved: best.length > seedCount,
        timedOut,
      };
    }

    function buildRingLayouts() {
      const layouts = [];
      const seen = new Set();
      const addVariants = sideRotated => {
        const side = sideRotated
          ? { w: state.box.d, d: state.box.w, rotated: true }
          : { w: state.box.w, d: state.box.d, rotated: false };
        const band = sideRotated
          ? { w: state.box.w, d: state.box.d, rotated: false }
          : { w: state.box.d, d: state.box.w, rotated: true };
        const verticalSpan = state.pallet.d - band.d;
        const horizontalSpan = state.pallet.w - side.w;
        const sideCount = Math.floor((verticalSpan + 0.001) / side.d);
        const bandCount = Math.floor((horizontalSpan + 0.001) / band.w);
        if (sideCount < 1 || bandCount < 1) return;

        const sideHeight = sideCount * side.d;
        const bandWidth = bandCount * band.w;
        const ringWidth = side.w + bandWidth;
        const ringHeight = band.d + sideHeight;
        const offsetX = (state.pallet.w - ringWidth) / 2;
        const offsetY = (state.pallet.d - ringHeight) / 2;
        const rects = [];
        for (let i = 0; i < sideCount; i++) {
          rects.push({ x: offsetX, y: offsetY + i * side.d, ...side });
        }
        for (let i = 0; i < bandCount; i++) {
          rects.push({ x: offsetX + side.w + i * band.w, y: offsetY, ...band });
        }
        for (let i = 0; i < sideCount; i++) {
          rects.push({ x: offsetX + bandWidth, y: offsetY + band.d + i * side.d, ...side });
        }
        for (let i = 0; i < bandCount; i++) {
          rects.push({ x: offsetX + i * band.w, y: offsetY + sideHeight, ...band });
        }

        const variants = [
          rects,
          rects.map(rect => ({ ...rect, x: state.pallet.w - rect.x - rect.w })),
        ];
        variants.forEach(layout => {
          const inside = layout.every(rect =>
            rect.x >= -0.001 && rect.y >= -0.001 &&
            rect.x + rect.w <= state.pallet.w + 0.001 &&
            rect.y + rect.d <= state.pallet.d + 0.001
          );
          const overlaps = layout.some((rect, index) =>
            layout.slice(index + 1).some(other => rectanglesOverlap(rect, other))
          );
          const signature = layout
            .map(rect => `${Math.round(rect.x)}:${Math.round(rect.y)}:${Math.round(rect.w)}:${Math.round(rect.d)}:${rect.rotated ? 1 : 0}`)
            .sort()
            .join("|");
          if (inside && !overlaps && !seen.has(signature)) {
            seen.add(signature);
            layouts.push(layout);
          }
        });
      };

      addVariants(false);
      addVariants(true);
      return layouts;
    }

    const MIN_PLAN_UTILIZATION = 0.7;

    function calculatePlans() {
      readForm();
      const plans = [];
      const rectangleKey = rect => `${Math.round(rect.x)}:${Math.round(rect.y)}:${Math.round(rect.w)}:${Math.round(rect.d)}`;
      const layoutSignature = rects => {
        const variants = [
          rects,
          rects.map(rect => ({ ...rect, x: state.pallet.w - rect.x - rect.w })),
          rects.map(rect => ({ ...rect, y: state.pallet.d - rect.y - rect.d })),
          rects.map(rect => ({
            ...rect,
            x: state.pallet.w - rect.x - rect.w,
            y: state.pallet.d - rect.y - rect.d,
          })),
        ];
        return variants
          .map(layout => layout.map(rectangleKey).sort().join("|"))
          .sort()[0];
      };
      const addPlan = (nameKey, noteKey, rects, strategy, vars = {}, options = {}) => {
        if (!rects.length) return;
        const count = rects.length;
        const signature = layoutSignature(rects);
        const duplicate = plans.find(plan => plan.signature === signature);
        if (duplicate) {
          duplicate.provenOptimal ||= Boolean(options.provenOptimal);
          return duplicate;
        }
        const used = count * state.box.w * state.box.d;
        const plan = { id: uid(), nameKey, noteKey, vars, rects, count, util: used / (state.pallet.w * state.pallet.d), strategy, signature, provenOptimal: Boolean(options.provenOptimal) };
        plans.push(plan);
        return plan;
      };

      const normalRows = buildRows([{ rotated: false, rows: Math.floor(state.pallet.d / state.box.d) }]).rects;
      addPlan("planNormal", "noteNormal", normalRows, "rows-normal");

      const rotatedRows = buildRows([{ rotated: true, rows: Math.floor(state.pallet.d / state.box.w) }]).rects;
      addPlan("planRotated", "noteRotated", rotatedRows, "rows-rotated");

      const maxNormalRows = Math.floor(state.pallet.d / state.box.d);
      const maxRotRows = Math.floor(state.pallet.d / state.box.w);
      for (let n = 0; n <= maxNormalRows; n++) {
        for (let r = 0; r <= maxRotRows; r++) {
          if (!n && !r) continue;
          const h = n * state.box.d + r * state.box.w;
          if (h > state.pallet.d + 0.01) continue;
          addPlan("planMixedRows", "noteMixedRows", buildRows([{ rotated: false, rows: n }, { rotated: true, rows: r }]).rects, "rows-mixed", { n, r });
          addPlan("planMixedRowsAlt", "noteMixedRowsAlt", buildRows([{ rotated: true, rows: r }, { rotated: false, rows: n }]).rects, "rows-mixed-alt", { n, r });
        }
      }

      const maxNormalCols = Math.floor(state.pallet.w / state.box.w);
      const maxRotCols = Math.floor(state.pallet.w / state.box.d);
      for (let n = 0; n <= maxNormalCols; n++) {
        for (let r = 0; r <= maxRotCols; r++) {
          if (!n && !r) continue;
          const w = n * state.box.w + r * state.box.d;
          if (w > state.pallet.w + 0.01) continue;
          addPlan("planMixedCols", "noteMixedCols", buildColumns([{ rotated: false, cols: n }, { rotated: true, cols: r }]).rects, "cols-mixed", { n, r });
          addPlan("planMixedColsAlt", "noteMixedColsAlt", buildColumns([{ rotated: true, cols: r }, { rotated: false, cols: n }]).rects, "cols-mixed-alt", { n, r });
        }
      }

      const conventionalBestCount = plans.reduce((best, plan) => Math.max(best, plan.count), 0);
      const minimumRingUtilization = 0.84;
      const bestRing = buildRingLayouts()
        .map(rects => ({
          rects,
          count: rects.length,
          util: rects.length * state.box.w * state.box.d / (state.pallet.w * state.pallet.d),
        }))
        .filter(candidate =>
          candidate.count > conventionalBestCount &&
          candidate.util >= minimumRingUtilization
        )
        .sort((a, b) => b.count - a.count || b.util - a.util)[0];
      if (bestRing) {
        addPlan("planRing", "noteRing", bestRing.rects, "ring");
      }

      const seedPlan = plans.reduce((best, plan) => !best || plan.count > best.count ? plan : best, null);
      const spatial = searchSpatialLayout(seedPlan?.rects || []);
      if (spatial.improved) {
        addPlan("planOptimized", "noteOptimized", spatial.rects, "spatial-search", {}, { provenOptimal: spatial.provenOptimal });
      } else if (spatial.provenOptimal && seedPlan) {
        seedPlan.provenOptimal = true;
      }

      const eligiblePlans = plans.filter(plan => plan.util >= MIN_PLAN_UTILIZATION - 1e-9);
      eligiblePlans.sort((a, b) => b.count - a.count || Number(b.provenOptimal) - Number(a.provenOptimal) || b.util - a.util || t(a.nameKey, a.vars).localeCompare(t(b.nameKey, b.vars), state.lang === "zh" ? "zh-CN" : "en"));
      state.plans = eligiblePlans.slice(0, 7);
      state.activePlan = state.plans[0]?.id ?? null;
      state.planMessageKey = state.plans.length ? null : (plans.length ? "noEfficientPlan" : "noFitPlan");
      renderPlans();
      if (state.plans[0]) {
        applyPlan(state.plans[0].id);
      } else {
        state.layout = [];
        state.selectedId = null;
        render2D();
        showToast(t(state.planMessageKey || "noFitPlan"));
      }
    }

    function buildRows(parts) {
      const totalH = parts.reduce((sum, part) => sum + part.rows * (part.rotated ? state.box.w : state.box.d), 0);
      let y = (state.pallet.d - totalH) / 2;
      const rects = [];
      parts.forEach(part => {
        const rowH = part.rotated ? state.box.w : state.box.d;
        const itemW = part.rotated ? state.box.d : state.box.w;
        const itemD = rowH;
        const count = Math.floor(state.pallet.w / itemW);
        const rowW = count * itemW;
        const x0 = (state.pallet.w - rowW) / 2;
        for (let row = 0; row < part.rows; row++) {
          for (let i = 0; i < count; i++) rects.push({ x: x0 + i * itemW, y, w: itemW, d: itemD, rotated: part.rotated });
          y += rowH;
        }
      });
      return { rects };
    }

    function buildColumns(parts) {
      const totalW = parts.reduce((sum, part) => sum + part.cols * (part.rotated ? state.box.d : state.box.w), 0);
      let x = (state.pallet.w - totalW) / 2;
      const rects = [];
      parts.forEach(part => {
        const colW = part.rotated ? state.box.d : state.box.w;
        const itemD = part.rotated ? state.box.w : state.box.d;
        const count = Math.floor(state.pallet.d / itemD);
        const colD = count * itemD;
        const y0 = (state.pallet.d - colD) / 2;
        for (let col = 0; col < part.cols; col++) {
          for (let i = 0; i < count; i++) rects.push({ x, y: y0 + i * itemD, w: colW, d: itemD, rotated: part.rotated });
          x += colW;
        }
      });
      return { rects };
    }

    function renderPlans() {
      els.planList.innerHTML = "";
      if (!state.plans.length) {
        const empty = document.createElement("p");
        empty.style.margin = "0";
        empty.style.color = "var(--muted)";
        empty.textContent = t(state.planMessageKey || "emptyPlans");
        els.planList.appendChild(empty);
        return;
      }

      state.plans.forEach((plan, index) => {
        const card = document.createElement("div");
        card.className = `plan-card ${plan.id === state.activePlan ? "active" : ""}`;
        card.innerHTML = `
          <div class="plan-head">
            <strong>${index + 1}. ${t(plan.nameKey, plan.vars)}</strong>
            <button class="small" data-plan="${plan.id}">${t("apply")}</button>
          </div>
          <p>${t("planMeta", { count: plan.count, total: plan.count * state.layers, util: (plan.util * 100).toFixed(1) })}${plan.provenOptimal ? `<span class="plan-proof">${t("optimalProof")}</span>` : ""}</p>
          <div class="plan-mini" aria-hidden="true"></div>
        `;
        drawMini(card.querySelector(".plan-mini"), plan.rects);
        card.querySelector("button").addEventListener("click", () => applyPlan(plan.id));
        els.planList.appendChild(card);
      });
    }

    function drawMini(host, rects) {
      host.style.setProperty("--mini-ratio", `${state.pallet.w} / ${state.pallet.d}`);
      rects.forEach(rect => {
        const item = document.createElement("span");
        item.style.position = "absolute";
        item.style.left = `${(rect.x / state.pallet.w) * 100}%`;
        item.style.top = `${(rect.y / state.pallet.d) * 100}%`;
        item.style.width = `${(rect.w / state.pallet.w) * 100}%`;
        item.style.height = `${(rect.d / state.pallet.d) * 100}%`;
        item.style.background = state.colors.box;
        item.style.border = "1px solid rgba(29,38,51,.45)";
        host.appendChild(item);
      });
    }

    function applyPlan(id) {
      const plan = state.plans.find(item => item.id === id);
      if (!plan) return;
      state.layout = plan.rects.map(rect => ({ id: uid(), ...rect }));
      state.selectedId = state.layout[0]?.id ?? null;
      state.activePlan = id;
      renderPlans();
      render2D();
      showToast(t("appliedPlan", { name: t(plan.nameKey, plan.vars) }));
    }

    function rebuildForNewSize() {
      readForm();
      state.layout = state.layout.map(box => {
        const rotated = box.rotated;
        const w = rotated ? state.box.d : state.box.w;
        const d = rotated ? state.box.w : state.box.d;
        return { ...box, w, d, x: clamp(box.x, 0, Math.max(0, state.pallet.w - w)), y: clamp(box.y, 0, Math.max(0, state.pallet.d - d)) };
      });
      state.plans = [];
      state.planMessageKey = null;
      state.activePlan = null;
      renderPlans();
      render2D();
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 1700);
    }

    let scene, camera, renderer, controls, modelGroup, floorMesh;
    const UNIT = 0.004;

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);
      camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
      camera.position.set(4.8, 4.2, 5.6);
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      els.scene3d.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.55, 0);
      controls.maxPolarAngle = Math.PI * 0.48;

      const hemi = new THREE.HemisphereLight(0xffffff, 0x7d8a94, 2.1);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(3, 6, 4);
      sun.castShadow = true;
      scene.add(sun);
      floorMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(18, 18),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 })
      );
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.position.y = -0.02;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      modelGroup = new THREE.Group();
      scene.add(modelGroup);

      const resize = () => {
        const rect = els.scene3d.getBoundingClientRect();
        const width = Math.max(200, rect.width);
        const height = Math.max(260, rect.height);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      };
      new ResizeObserver(resize).observe(els.scene3d);
      resize();

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
    }

    function material(color, roughness = 0.72) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.02 });
    }

    function addCuboid(group, x, y, z, w, h, d, color, name = "") {
      const geo = new THREE.BoxGeometry(w * UNIT, h * UNIT, d * UNIT);
      const mesh = new THREE.Mesh(geo, material(color));
      mesh.position.set(x * UNIT, y * UNIT, z * UNIT);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = name;
      group.add(mesh);

      const edge = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x263241, linewidth: 1 })
      );
      edge.position.copy(mesh.position);
      group.add(edge);
      return mesh;
    }

    function addTopLine(group, x1, z1, x2, z2, y, color, opacity = 0.45) {
      const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1 * UNIT, y * UNIT, z1 * UNIT),
        new THREE.Vector3(x2 * UNIT, y * UNIT, z2 * UNIT),
      ]);
      const line = new THREE.Line(
        geometry,
        new THREE.LineBasicMaterial({ color, transparent: true, opacity })
      );
      group.add(line);
      return line;
    }

    function addDimensionLine(group, points, color = 0x1d2633, opacity = 0.9) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points.map(point => (
        new THREE.Vector3(point[0] * UNIT, point[1] * UNIT, point[2] * UNIT)
      )));
      const line = new THREE.Line(
        geometry,
        new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthTest: false })
      );
      line.renderOrder = 20;
      group.add(line);
      return line;
    }

    function drawRoundedRect(ctx, x, y, w, h, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function makeDimensionLabel(text) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      ctx.font = "800 28px Arial, 'Microsoft YaHei', sans-serif";
      const textWidth = Math.ceil(ctx.measureText(text).width);
      canvas.width = Math.max(190, textWidth + 44);
      canvas.height = 64;
      ctx.font = "800 28px Arial, 'Microsoft YaHei', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      drawRoundedRect(ctx, 3, 3, canvas.width - 6, canvas.height - 6, 14);
      ctx.fillStyle = "rgba(255, 255, 255, .94)";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#1d2633";
      ctx.stroke();
      ctx.fillStyle = "#1d2633";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 1);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
      const spriteWidth = Math.max(0.9, canvas.width / 245);
      sprite.scale.set(spriteWidth, spriteWidth * (canvas.height / canvas.width), 1);
      sprite.renderOrder = 30;
      return sprite;
    }

    function addDimensionLabel(group, text, x, y, z) {
      const sprite = makeDimensionLabel(text);
      sprite.position.set(x * UNIT, y * UNIT, z * UNIT);
      group.add(sprite);
      return sprite;
    }

    function addDimensionAnnotations(group, dims) {
      const l = dims.l;
      const w = dims.w;
      const h = dims.h;
      const x0 = -l / 2;
      const x1 = l / 2;
      const z0 = -w / 2;
      const z1 = w / 2;
      const gap = Math.max(95, Math.min(l, w) * 0.12);
      const tick = Math.max(36, Math.min(l, w) * 0.045);
      const topY = h + Math.max(70, h * 0.08);
      const line = 0x1d2633;
      const accent = 0xf59f0b;

      const zLength = z1 + gap;
      addDimensionLine(group, [[x0, topY, zLength], [x1, topY, zLength]], accent, 1);
      addDimensionLine(group, [[x0, topY, zLength - tick], [x0, topY, zLength + tick]], line, 0.85);
      addDimensionLine(group, [[x1, topY, zLength - tick], [x1, topY, zLength + tick]], line, 0.85);
      addDimensionLine(group, [[x0, h, z1], [x0, topY, zLength]], line, 0.35);
      addDimensionLine(group, [[x1, h, z1], [x1, topY, zLength]], line, 0.35);
      addDimensionLabel(group, t("dimLength", { value: fmt(Math.round(l)) }), 0, topY + 42, zLength);

      const xWidth = x1 + gap;
      addDimensionLine(group, [[xWidth, topY, z0], [xWidth, topY, z1]], accent, 1);
      addDimensionLine(group, [[xWidth - tick, topY, z0], [xWidth + tick, topY, z0]], line, 0.85);
      addDimensionLine(group, [[xWidth - tick, topY, z1], [xWidth + tick, topY, z1]], line, 0.85);
      addDimensionLine(group, [[x1, h, z0], [xWidth, topY, z0]], line, 0.35);
      addDimensionLine(group, [[x1, h, z1], [xWidth, topY, z1]], line, 0.35);
      addDimensionLabel(group, t("dimWidth", { value: fmt(Math.round(w)) }), xWidth + gap * 0.25, topY + 42, 0);

      const xHeight = x1 + gap * 0.78;
      const zHeight = z1 + gap * 0.64;
      addDimensionLine(group, [[xHeight, 0, zHeight], [xHeight, h, zHeight]], accent, 1);
      addDimensionLine(group, [[xHeight - tick, 0, zHeight], [xHeight + tick, 0, zHeight]], line, 0.85);
      addDimensionLine(group, [[xHeight - tick, h, zHeight], [xHeight + tick, h, zHeight]], line, 0.85);
      addDimensionLine(group, [[x1, 0, z1], [xHeight, 0, zHeight]], line, 0.35);
      addDimensionLine(group, [[x1, h, z1], [xHeight, h, zHeight]], line, 0.35);
      addDimensionLabel(group, t("dimHeight", { value: fmt(Math.round(h)) }), xHeight + gap * 0.28, h / 2, zHeight);
    }

    function addNail(group, x, z, y, radius = 4) {
      const nail = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * UNIT, radius * UNIT, 1.6 * UNIT, 14),
        new THREE.MeshStandardMaterial({ color: 0x7b5a36, roughness: 0.85 })
      );
      nail.position.set(x * UNIT, y * UNIT, z * UNIT);
      group.add(nail);
      return nail;
    }

    function redraw3D() {
      if (!modelGroup) return;
      modelGroup.clear();

      const p = state.pallet;
      const deckH = Math.min(42, Math.max(28, p.h * 0.32));
      const supportH = Math.max(44, p.h - deckH);
      const w = p.w;
      const dpth = p.d;
      const x0 = -w / 2;
      const z0 = -dpth / 2;
      const wood = state.colors.pallet;

      addCuboid(modelGroup, 0, p.h - deckH / 2, 0, w, deckH, dpth, wood, "single plywood deck");

      const sideStringerW = Math.max(130, w * 0.16);
      const centerStringerW = Math.max(120, w * 0.14);
      const supportY = supportH / 2;
      addCuboid(modelGroup, x0 + sideStringerW / 2, supportY, 0, sideStringerW, supportH, dpth, wood, "left stringer");
      addCuboid(modelGroup, 0, supportY, 0, centerStringerW, supportH, dpth, wood, "center stringer");
      addCuboid(modelGroup, -x0 - sideStringerW / 2, supportY, 0, sideStringerW, supportH, dpth, wood, "right stringer");

      const grainY = p.h + 1.2;
      for (let i = 1; i <= 9; i++) {
        const z = z0 + (dpth * i) / 10;
        addTopLine(modelGroup, x0 + 38, z, x0 + w - 38, z + (i % 2 ? 8 : -6), grainY, 0x8f683a, 0.28);
      }
      [-w * 0.43, -w * 0.18, w * 0.18, w * 0.43].forEach(x => {
        [-dpth * 0.42, -dpth * 0.18, dpth * 0.18, dpth * 0.42].forEach(z => {
          addNail(modelGroup, x, z, grainY + 0.4, Math.max(3.5, Math.min(w, dpth) * 0.004));
        });
      });

      if (!document.querySelector("#palletOnly3d")?.checked) {
        state.layout.forEach(box => {
          for (let layer = 0; layer < state.layers; layer++) {
            const cx = x0 + box.x + box.w / 2;
            const cz = z0 + box.y + box.d / 2;
            const cy = p.h + layer * state.box.h + state.box.h / 2;
            addCuboid(modelGroup, cx, cy, cz, box.w, state.box.h, box.d, boxColor(box), "carton");
          }
        });
      }

      const dims = visibleOuterDimensions();
      updateDimensionReadout();
      if (state.showDimensions) addDimensionAnnotations(modelGroup, dims);

      modelGroup.rotation.y = -0.25;
      const annotationPad = state.showDimensions ? Math.max(220, Math.min(dims.l, dims.w) * 0.3) : 0;
      const maxDim = Math.max(dims.l + annotationPad * 2, dims.w + annotationPad * 2, dims.h + annotationPad) * UNIT;
      camera.position.set(maxDim * 1.4, maxDim * 1.05, maxDim * 1.55);
      controls.target.set(0, dims.h * UNIT * 0.45, 0);
      camera.updateProjectionMatrix();
    }

    function shadeHex(hex, factor) {
      const value = hex.replace("#", "");
      const r = Math.round(parseInt(value.slice(0, 2), 16) * factor);
      const g = Math.round(parseInt(value.slice(2, 4), 16) * factor);
      const b = Math.round(parseInt(value.slice(4, 6), 16) * factor);
      return `rgb(${clamp(r, 0, 255)}, ${clamp(g, 0, 255)}, ${clamp(b, 0, 255)})`;
    }

    function schedule3D() {
      if (state.renderQueued) return;
      state.renderQueued = true;
      requestAnimationFrame(() => {
        state.renderQueued = false;
        redraw3D();
      });
    }

    function export3D() {
      if (!renderer || !scene || !camera) return;
      renderer.render(scene, camera);
      const link = document.createElement("a");
      link.download = "pallet-3d-view.png";
      link.href = renderer.domElement.toDataURL("image/png");
      link.click();
      showToast(t("exported3d"));
    }

    function attachEvents() {
      ["palletW","palletD","palletH"].forEach(id => {
        document.querySelector(`#${id}`).addEventListener("input", () => {
          syncPalletPresetFromDimensions();
          rebuildForNewSize();
        });
      });
      ["boxW","boxD","boxH"].forEach(id => {
        document.querySelector(`#${id}`).addEventListener("input", () => {
          clearCartonPresetSelection();
          rebuildForNewSize();
        });
      });
      ["layers","palletColor","boxColor","gridSize"].forEach(id => {
        document.querySelector(`#${id}`).addEventListener("input", rebuildForNewSize);
      });
      els.palletPreset.addEventListener("change", applyPalletPreset);
      els.boxPreset.addEventListener("input", () => {
        applyCartonPreset();
        openCartonPresetList();
      });
      els.boxPreset.addEventListener("change", () => applyCartonPreset());
      els.boxPreset.addEventListener("click", openCartonPresetList);
      els.boxPreset.addEventListener("keydown", handleCartonPresetKeydown);
      els.boxPresetToggle.addEventListener("click", () => {
        const shouldOpen = els.boxPresetPopover.hidden;
        if (shouldOpen) {
          openCartonPresetList();
          els.boxPreset.focus();
        } else {
          closeCartonPresetList();
        }
      });
      els.boxPresetList.addEventListener("click", event => {
        const option = event.target.closest(".preset-option");
        if (!option) return;
        selectCartonPreset(state.presetMatches[Number(option.dataset.presetIndex)]);
      });
      document.addEventListener("pointerdown", event => {
        if (!els.boxPresetCombo.contains(event.target) && !els.boxPresetPopover.contains(event.target)) {
          closeCartonPresetList();
        }
      });
      ["palletWeight","boxWeight","perBox"].forEach(id => {
        document.querySelector(`#${id}`).addEventListener("input", () => {
          readForm();
          updateMetrics(collectOverlaps());
        });
      });
      document.querySelector("#generatePallet").addEventListener("click", rebuildForNewSize);
      document.querySelector("#addBox").addEventListener("click", () => addBox(false));
      document.querySelector("#autoPlan").addEventListener("click", calculatePlans);
      document.querySelector("#applyBest").addEventListener("click", () => {
        if (!state.plans.length) calculatePlans();
        else applyPlan(state.plans[0].id);
      });
      document.querySelector("#clearBoxes").addEventListener("click", () => {
        state.layout = [];
        state.selectedId = null;
        state.activePlan = null;
        renderPlans();
        render2D();
      });
      document.querySelector("#rotateBox").addEventListener("click", () => rotateBox());
      document.querySelector("#centerLayout").addEventListener("click", centerLayout);
      document.querySelector("#addRow").addEventListener("click", addRow);
      document.querySelector("#rotateBoxToolbar").addEventListener("click", () => rotateBox());
      document.querySelector("#centerLayoutToolbar").addEventListener("click", centerLayout);
      document.querySelector("#export3d").addEventListener("click", export3D);
      document.querySelector("#showDimensions3d").addEventListener("change", () => {
        state.showDimensions = els.showDimensions3d.checked;
        localStorage.setItem("palletPlannerShowDimensions", String(state.showDimensions));
        updateDimensionReadout();
        schedule3D();
      });
      document.querySelector("#palletOnly3d").addEventListener("change", () => {
        updateDimensionReadout();
        schedule3D();
      });
      document.querySelector("#langToggle").addEventListener("click", () => {
        state.lang = state.lang === "zh" ? "en" : "zh";
        localStorage.setItem("palletPlannerLang", state.lang);
        applyLanguage();
      });
      document.querySelector("#themeToggle").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyTheme();
      });
      document.querySelectorAll("[data-align]").forEach(button => button.addEventListener("click", () => alignSelected(button.dataset.align)));
      els.paneResizers.forEach(resizer => {
        resizer.addEventListener("pointerdown", startPaneResize);
        resizer.addEventListener("pointermove", movePaneResize);
        resizer.addEventListener("pointerup", finishPaneResize);
        resizer.addEventListener("pointercancel", finishPaneResize);
        resizer.addEventListener("dblclick", resetPaneLayout);
        resizer.addEventListener("keydown", handlePaneResizerKeydown);
      });
      els.board.addEventListener("pointerdown", event => {
        if (event.target === els.board) {
          state.selectedId = null;
          render2D();
        }
      });
      window.addEventListener("keydown", handleKeyboardShortcuts);
      window.addEventListener("resize", () => {
        handlePaneViewportResize();
        positionCartonPresetPopover();
      });
      window.addEventListener("scroll", event => {
        if (event.target !== els.boxPresetList) positionCartonPresetPopover();
      }, true);
    }

    els.showDimensions3d.checked = state.showDimensions;
    restorePaneLayout();

    syncPalletPresetFromDimensions();
    readForm();
    attachEvents();
    applyTheme();
    applyLanguage({ rerender: false });
    calculatePlans();
    applyLanguage();

    try {
      [THREE, { OrbitControls }] = await Promise.all([
        import("three"),
        import("three/addons/controls/OrbitControls.js"),
      ]);
      init3D();
      schedule3D();
    } catch (error) {
      console.warn("3D preview is unavailable; 2D planning and language controls remain active.", error);
    }
  </script>
</body>
</html>
