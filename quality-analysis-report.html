  var $=function(i){return document.getElementById(i);};
  var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
  var norm=function(s){return s.replace(/[\s\-]+/g,'').toUpperCase();};
  async function decrypt(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(norm(pw)),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function show(html){
    try{ sessionStorage.setItem('phjy_gate_ok','1'); }catch(e){}     // 仪表盘自带的遮罩不再重复出现
    document.open(); document.write(html); document.close();
  }
  async function attempt(pw,silent){
    if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){
      if(!silent) $('err').textContent='当前浏览器不支持解密，请使用较新的 Chrome / Edge / Safari。Browser not supported.';
      return;
    }
    $('go').disabled=true; if(!silent) $('err').textContent='解密中… Decrypting…';
    try{
      var html=await decrypt(pw);
      try{ sessionStorage.setItem('phjy_enc_pw',pw); }catch(e){}
      show(html);
    }catch(e){
      try{ sessionStorage.removeItem('phjy_enc_pw'); }catch(_){}
      $('go').disabled=false;
      if(!silent){
        $('err').textContent='密码错误，请重试 Wrong password, try again';
        var c=$('card'); c.classList.add('shake'); setTimeout(function(){c.classList.remove('shake');},500);
        $('pw').select();
      } else { $('err').textContent=''; }
    }
  }
  $('go').onclick=function(){ attempt($('pw').value,false); };
  $('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') attempt($('pw').value,false); });
  var saved=null; try{ saved=sessionStorage.getItem('phjy_enc_pw'); }catch(e){}
  if(saved) attempt(saved,true);
})();
